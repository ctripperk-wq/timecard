<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F3EEE8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14100C" media="(prefers-color-scheme: dark)">
<meta name="description" content="私有自動車の業務使用を記録し、運転日誌をExcelで出力する。">
<title>運転日誌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
  :root {
    --ground: #F3EEE8;
    --surface: #FFFFFF;
    --surface-2: #F8F5F1;
    --line: #E3DAD0;
    --line-strong: #CFC2B4;
    --ink: #221A12;
    --ink-2: #6B5E51;
    --ink-3: #978A7C;
    --accent: #A0521C;
    --accent-ink: #7C3E13;
    --accent-soft: #F6E6D9;
    --accent-line: #E3BFA2;
    --on-accent: #FFFFFF;
    --out: #2E6B5A;
    --out-ink: #1F4E41;
    --out-soft: #DCEDE7;
    --on-out: #FFFFFF;
    --amber: #8A6212;
    --amber-soft: #F7EBD2;
    --danger: #B23B2A;
    --radius: 14px;
    --shadow-card: 0 1px 0 rgba(34,26,18,.04), 0 10px 26px -18px rgba(34,26,18,.35);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #14100C; --surface: #1D1813; --surface-2: #241E18; --line: #352C23; --line-strong: #4A3F34;
      --ink: #F1E9E0; --ink-2: #BDAE9F; --ink-3: #8C7E70;
      --accent: #E0925A; --accent-ink: #8E4E1F; --accent-soft: #3A2616; --accent-line: #6B4427; --on-accent: #1B0F06;
      --out: #5FB89E; --out-ink: #2B6353; --out-soft: #17302A; --on-out: #07140F;
      --amber: #D9A441; --amber-soft: #2E2413; --danger: #E3735F;
      --shadow-card: 0 1px 0 rgba(0,0,0,.3), 0 12px 28px -18px rgba(0,0,0,.8);
    }
  }
  :root[data-theme="dark"] {
    --ground: #14100C; --surface: #1D1813; --surface-2: #241E18; --line: #352C23; --line-strong: #4A3F34;
    --ink: #F1E9E0; --ink-2: #BDAE9F; --ink-3: #8C7E70;
    --accent: #E0925A; --accent-ink: #8E4E1F; --accent-soft: #3A2616; --accent-line: #6B4427; --on-accent: #1B0F06;
    --out: #5FB89E; --out-ink: #2B6353; --out-soft: #17302A; --on-out: #07140F;
    --amber: #D9A441; --amber-soft: #2E2413; --danger: #E3735F;
    --shadow-card: 0 1px 0 rgba(0,0,0,.3), 0 12px 28px -18px rgba(0,0,0,.8);
  }
  html { color-scheme: light dark; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font-family: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, system-ui, sans-serif;
    font-size: 15px; line-height: 1.65; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  }
  [hidden] { display: none !important; }
  .mono { font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; font-variant-numeric: tabular-nums; }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { touch-action: manipulation; }
  /* 16px未満だと端末が入力時に拡大して戻らないため下げない */
  input, textarea, select { font-size: 16px; }
  .wrap {
    max-width: 640px; margin: 0 auto;
    padding: calc(18px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right))
             calc(60px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left));
  }
  .top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding-bottom: 12px; margin-bottom: 16px; border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-eyebrow { font-family: "IBM Plex Mono", monospace; font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--ink-3); line-height: 1; }
  .brand-name { font-size: 18px; font-weight: 700; letter-spacing: .04em; }
  .monthnav { display: flex; align-items: center; gap: 4px; }
  .monthnav button { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 9px; width: 34px; height: 34px; cursor: pointer; font-size: 14px; }
  .monthnav b { font-size: 15px; padding: 0 6px; white-space: nowrap; }
  .stack { display: grid; gap: 14px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow-card); padding: 16px; }
  .card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
  .card-title { font-size: 12px; letter-spacing: .1em; color: var(--ink-2); margin: 0; font-weight: 700; }
  .card-note { font-size: 12px; color: var(--ink-3); }
  details.card > summary { list-style: none; cursor: pointer; }
  details.card > summary::-webkit-details-marker { display: none; }
  details.card > summary .card-head { margin-bottom: 0; }
  details.card[open] > summary .card-head { margin-bottom: 12px; }
  details.card > summary .card-title::after { content: " ▾"; }
  details.card[open] > summary .card-title::after { content: " ▴"; }

  .field { display: block; margin-bottom: 12px; }
  .field > span { display: block; font-size: 12px; color: var(--ink-2); margin-bottom: 4px; }
  .field input, .field select, .field textarea {
    width: 100%; box-sizing: border-box; padding: 11px 12px; border-radius: 10px;
    border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink);
  }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .row3 { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: end; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .chips:empty { display: none; }
  .chip {
    background: var(--surface); border: 1px solid var(--accent-line); color: var(--accent);
    border-radius: 999px; padding: 4px 11px; cursor: pointer; font-size: 13px; font-weight: 500;
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .seg { display: flex; gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 10px; }
  .seg button { flex: 1; border: 0; background: none; cursor: pointer; border-radius: 7px; padding: 8px 6px; font-size: 14px; color: var(--ink-2); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); font-weight: 700; }
  .check { display: flex; align-items: center; gap: 10px; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line-strong); cursor: pointer; margin-bottom: 12px; }
  .check input { width: 22px; height: 22px; accent-color: var(--accent); margin: 0; }
  .check.on { background: var(--out-soft); border-color: transparent; }
  .check small { color: var(--ink-3); font-size: 11.5px; }

  .key {
    width: 100%; border: 0; cursor: pointer; border-radius: 12px; padding: 16px; margin-top: 4px;
    background: var(--accent); color: var(--on-accent); box-shadow: 0 4px 0 var(--accent-ink);
    display: grid; gap: 2px; justify-items: center;
  }
  .key b { font-size: 22px; letter-spacing: .25em; text-indent: .25em; }
  .key span { font-size: 12px; opacity: .85; }
  .key.end { background: var(--out); color: var(--on-out); box-shadow: 0 4px 0 var(--out-ink); }
  .key:active { transform: translateY(3px); box-shadow: none; }
  .key[disabled] { opacity: .5; }
  .btn { border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); padding: 9px 14px; border-radius: 10px; cursor: pointer; font-size: 14px; font-weight: 500; }
  .btn-primary { background: var(--accent); color: var(--on-accent); border-color: transparent; font-weight: 700; }
  .btn-danger { color: var(--danger); border-color: var(--danger); }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .btns .btn-primary { flex: 1 1 160px; }
  .note { font-size: 12px; color: var(--ink-2); margin: 8px 0 0; line-height: 1.6; }
  .warn { font-size: 13px; color: var(--danger); margin: 8px 0 0; }

  .live { background: var(--accent-soft); border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; }
  .live-time { font-size: 30px; font-weight: 500; line-height: 1.1; }
  .live-sub { font-size: 12.5px; color: var(--ink-2); }
  .geo { font-size: 12px; color: var(--ink-3); margin-top: 6px; }

  .list { display: grid; gap: 8px; }
  .trip { border: 1px solid var(--line); border-radius: 11px; padding: 10px 12px; cursor: pointer; background: var(--surface); text-align: left; width: 100%; }
  .trip.open { border-color: var(--accent); border-width: 2px; }
  .trip-l1 { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
  .trip-l1 b { font-size: 14px; }
  .trip-km { font-size: 15px; font-weight: 600; }
  .trip-l2 { font-size: 13px; color: var(--ink-2); overflow-wrap: anywhere; }
  .trip-cost { font-size: 12.5px; color: var(--ink-2); margin-top: 3px; padding-left: 10px; border-left: 2px solid var(--line-strong); }
  .tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 0 6px; border-radius: 5px; background: var(--amber-soft); color: var(--amber); margin-right: 4px; }
  .tag.ok { background: var(--out-soft); color: var(--out); }
  .tag.ng { background: #F4DAD5; color: var(--danger); }
  .empty { text-align: center; color: var(--ink-3); font-size: 13px; padding: 18px 6px; }

  .sum { display: grid; gap: 6px; }
  .sum-line { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; }
  .sum-line b { font-family: "IBM Plex Mono", monospace; }
  .sum-total { border-top: 1px solid var(--line); padding-top: 8px; margin-top: 4px; font-size: 16px; font-weight: 700; }

  .editor { border: 2px solid var(--accent); border-radius: 12px; padding: 14px; background: var(--surface); }
  .tf { display: inline-flex; align-items: center; gap: 4px; }
  .tf input { width: 3.4em; padding: 10px 6px; text-align: center; border-radius: 9px; border: 1px solid var(--line-strong); background: var(--surface); }
  .cost-row { border: 1px dashed var(--line-strong); border-radius: 10px; padding: 10px; margin-bottom: 8px; }
  .cost-row .seg { margin-bottom: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true">
        <rect x="3" y="9" width="24" height="12" rx="4" fill="none" stroke="var(--accent)" stroke-width="2"></rect>
        <circle cx="9" cy="22" r="3" fill="var(--surface)" stroke="var(--accent)" stroke-width="2"></circle>
        <circle cx="21" cy="22" r="3" fill="var(--surface)" stroke="var(--accent)" stroke-width="2"></circle>
        <path d="M8 9l3-4h8l3 4" fill="none" stroke="var(--accent)" stroke-width="2"></path>
      </svg>
      <div>
        <div class="brand-eyebrow">Driving Log</div>
        <div class="brand-name">運転日誌</div>
      </div>
    </div>
    <div class="monthnav">
      <button id="mPrev" aria-label="前の月">◀</button>
      <b id="mLabel"></b>
      <button id="mNext" aria-label="次の月">▶</button>
    </div>
  </header>

  <div class="stack">
    <section class="card" id="nowCard"></section>
    <section class="card" id="editCard" hidden></section>

    <section class="card">
      <div class="card-head">
        <h2 class="card-title">この月の記録</h2>
        <span class="card-note" id="listNote"></span>
      </div>
      <div class="list" id="list"></div>
      <div class="btns"><button class="btn" id="addManual">あとから手で追加</button></div>
    </section>

    <section class="card">
      <div class="card-head"><h2 class="card-title">集計</h2><span class="card-note" id="sumNote"></span></div>
      <div class="sum" id="sum"></div>
      <div class="row2" style="margin-top:12px">
        <label class="field"><span>使用開始(a) メーター km</span><input type="number" id="odoA" inputmode="numeric" min="0" step="1"></label>
        <label class="field"><span>使用終了(b) メーター km</span><input type="number" id="odoB" inputmode="numeric" min="0" step="1"></label>
      </div>
      <p class="note" style="margin-top:0">月の最初と最後のメーターです。空けておいてもExcelは出せます。</p>
    </section>

    <section class="card">
      <div class="card-head"><h2 class="card-title">Excelで出力</h2></div>
      <label class="field"><span>記入日</span><input type="date" id="fillDate"></label>
      <div class="btns">
        <button class="btn btn-primary" id="xlsxShare" hidden>LINE・メールで送る</button>
        <button class="btn" id="xlsxSave">Excelファイルで保存</button>
      </div>
      <p class="note" id="xlsxNote">様式と同じ見た目のExcel（A4縦1枚）で出ます。「交」の欄はExcelでもプルダウンで選べ、交際費の合計が自動で計算されます。</p>
    </section>

    <details class="card" id="setCard">
      <summary><div class="card-head"><h2 class="card-title">設定</h2><span class="card-note" id="setNote"></span></div></summary>
      <label class="field"><span>いつもの出発地（区間の左側）</span><input type="text" id="sBase" maxlength="20" placeholder="例: 本社"></label>
      <label class="field"><span>車両</span>
        <div class="seg" id="sVehicle"><button data-v="car">自動車（1km 22円）</button><button data-v="bike">自動二輪車（1km 9円）</button></div>
      </label>
      <div class="row2">
        <label class="field"><span>自動車の単価（円/km）</span><input type="number" id="sRateCar" inputmode="numeric" min="0" step="1"></label>
        <label class="field"><span>自動二輪車の単価（円/km）</span><input type="number" id="sRateBike" inputmode="numeric" min="0" step="1"></label>
      </div>
      <p class="note">設定と記録は、このスマホの中だけに保存されます。</p>
    </details>

    <details class="card">
      <summary><div class="card-head"><h2 class="card-title">機種変更・バックアップ</h2><span class="card-note" id="bkNote"></span></div></summary>
      <p class="note" style="margin-top:0">全部の記録と設定を1つのファイルにまとめます。新しいスマホで「読み込む」を選ぶと元どおりになります。読み込んでも今の記録は消えず、足りない分だけ追加されます。</p>
      <div class="btns">
        <button class="btn" id="bkSave">ファイルに保存</button>
        <button class="btn" id="bkLoad">引っ越しファイルを読み込む</button>
      </div>
      <input type="file" id="bkFile" accept=".txt,.json,text/plain,application/json" hidden>
    </details>
  </div>
</div>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var LS_TRIPS = "unten-nisshi-trips-v1";
  var LS_SET = "unten-nisshi-settings-v1";
  var LS_MONTH = "unten-nisshi-months-v1";
  var ROAD_FACTOR = 1.3;          /* 直線距離から道のりを見積もる係数 */
  var KINDS = { "駐": "一時駐車料", "道": "有料道路", "タ": "タクシー・運転代行" };

  var trips = [], settings = {}, months = {};
  var curMonth = "";
  var editId = null;
  var draft = { to: "", purpose: "", round: true, checked: false };
  var geoMsg = "";
  var busy = false;

  /* ---------- 共通 ---------- */
  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function dateKey(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function hm(d) { return pad(d.getHours()) + ":" + pad(d.getMinutes()); }
  function monthOf(date) { return date.slice(0, 7); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function newId() { return "t" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function readLS(k, f) { try { var v = localStorage.getItem(k); return v == null ? f : JSON.parse(v); } catch (e) { return f; } }
  function writeLS(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
  function saveTrips() { writeLS(LS_TRIPS, trips); }
  function saveSettings() { writeLS(LS_SET, settings); }
  function saveMonths() { writeLS(LS_MONTH, months); }
  function yen(n) { return (Math.round(n) || 0).toLocaleString("ja-JP"); }
  function monthLabel(key) { var p = key.split("-"); return +p[0] + "年" + (+p[1]) + "月分"; }
  function shiftMonth(key, d) {
    var p = key.split("-"), y = +p[0], m = +p[1] + d;
    while (m < 1) { m += 12; y--; }
    while (m > 12) { m -= 12; y++; }
    return y + "-" + pad(m);
  }
  function rate() {
    return settings.vehicle === "bike" ? (+settings.rateBike || 9) : (+settings.rateCar || 22);
  }
  function tripById(id) { return trips.filter(function (t) { return t.id === id; })[0] || null; }
  function activeTrip() { return trips.filter(function (t) { return t.running; })[0] || null; }
  function monthTrips(key) {
    return trips.filter(function (t) { return monthOf(t.date) === key; }).sort(function (a, b) {
      return a.date.localeCompare(b.date) || (a.start || "").localeCompare(b.start || "");
    });
  }
  function recent(field) {
    var seen = {}, out = [];
    trips.slice().sort(function (a, b) { return (b.date + b.start).localeCompare(a.date + a.start); }).forEach(function (t) {
      var v = (t[field] || "").trim();
      if (v && !seen[v]) { seen[v] = 1; out.push(v); }
    });
    return out.slice(0, 6);
  }
  function recentCostPlaces() {
    var seen = {}, out = [];
    trips.slice().reverse().forEach(function (t) {
      (t.costs || []).forEach(function (c) { var v = (c.place || "").trim(); if (v && !seen[v]) { seen[v] = 1; out.push(v); } });
    });
    return out.slice(0, 6);
  }

  /* ---------- 位置 ---------- */
  function tryGeo(opts) {
    return new Promise(function (resolve) {
      if (!navigator.geolocation) return resolve(null);
      var done = false;
      var timer = setTimeout(function () { if (!done) { done = true; resolve(null); } }, (opts.timeout || 10000) + 1500);
      navigator.geolocation.getCurrentPosition(function (p) {
        if (done) return; done = true; clearTimeout(timer);
        resolve({ lat: +p.coords.latitude.toFixed(6), lng: +p.coords.longitude.toFixed(6), acc: Math.round(p.coords.accuracy) });
      }, function () { if (done) return; done = true; clearTimeout(timer); resolve(null); }, opts);
    });
  }
  function getLocation() {
    return tryGeo({ enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 }).then(function (r) {
      return r || tryGeo({ enableHighAccuracy: false, timeout: 8000, maximumAge: 120000 });
    });
  }
  function haversineKm(a, b) {
    var R = 6371, rad = Math.PI / 180;
    var dLat = (b.lat - a.lat) * rad, dLng = (b.lng - a.lng) * rad;
    var h = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
    return 2 * R * Math.asin(Math.min(1, Math.sqrt(h)));
  }
  /* 出発→目的地→終了 の直線距離に係数を掛けて道のりを見積もる */
  function estimateKm(t) {
    var L = t.locs || {};
    var pts = [L.start, L.dest, L.end].filter(Boolean);
    if (pts.length < 2) return null;
    var s = 0;
    for (var i = 1; i < pts.length; i++) s += haversineKm(pts[i - 1], pts[i]);
    if (t.round && L.start) {
      var back = haversineKm(pts[pts.length - 1], L.start);
      if (back > 0.5) s += back;          /* 行き先で終えた往復は、帰り道の分を足す */
      else if (!L.dest) return null;      /* 出発地に戻って終えただけでは、どこまで行ったか分からない */
    }
    return Math.max(1, Math.round(s * ROAD_FACTOR));
  }
  /* 位置から区（例: 安佐南区）を調べる */
  function wardName(loc) {
    var url = "https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=14&accept-language=ja&lat=" + loc.lat + "&lon=" + loc.lng;
    return fetch(url, { headers: { "Accept": "application/json" } }).then(function (r) { return r.json(); }).then(function (j) {
      var a = (j && j.address) || {};
      var cands = [a.city_district, a.suburb, a.borough, a.quarter, a.town, a.village, a.city].filter(Boolean);
      var ward = cands.filter(function (v) { return /区$/.test(v); })[0];
      return ward || cands[0] || "";
    })["catch"](function () { return ""; });
  }

  /* ---------- 打刻（出発・目的地・終了） ---------- */
  function startTrip() {
    if (busy || activeTrip()) return;
    if (!draft.checked && !confirm("使用前の点検がまだです。点検せずに出発しますか？")) return;
    busy = true;
    var now = new Date();
    var t = {
      id: newId(), date: dateKey(now), start: hm(now), end: "", running: true,
      checked: !!draft.checked, from: settings.base || "", to: draft.to.trim(), round: draft.round,
      purpose: draft.purpose.trim(), km: null, kmAuto: true, social: false, costs: [], locs: {}
    };
    trips.push(t);
    saveTrips();
    draft = { to: "", purpose: "", round: true, checked: false };
    geoMsg = "位置を確認しています…";
    render();
    getLocation().then(function (loc) {
      busy = false;
      if (loc) { t.locs.start = loc; geoMsg = "出発地の位置を記録しました"; } else { geoMsg = "位置を記録できませんでした（距離は手で入れてください）"; }
      saveTrips(); render();
    });
  }
  function markDest() {
    var t = activeTrip(); if (!t || busy) return;
    busy = true; geoMsg = "目的地の位置を確認しています…"; render();
    getLocation().then(function (loc) {
      if (!loc) { busy = false; geoMsg = "位置を記録できませんでした"; render(); return; }
      t.locs.dest = loc;
      saveTrips();
      return wardName(loc).then(function (w) {
        busy = false;
        if (w && !t.to) t.to = w;
        geoMsg = "目的地を記録しました" + (w ? "（" + w + "）" : "");
        if (t.kmAuto) t.km = estimateKm(t);
        saveTrips(); render();
      });
    });
  }
  function endTrip() {
    var t = activeTrip(); if (!t || busy) return;
    busy = true;
    var now = new Date();
    t.end = hm(now);
    t.running = false;
    geoMsg = "位置を確認しています…";
    saveTrips(); render();
    getLocation().then(function (loc) {
      if (loc) t.locs.end = loc;
      var fill = (!t.to && loc && t.locs.start && haversineKm(t.locs.start, loc) > 0.5) ? wardName(loc) : Promise.resolve("");
      return fill.then(function (w) {
        busy = false;
        if (w && !t.to) t.to = w;
        if (t.kmAuto) t.km = estimateKm(t);
        geoMsg = t.km != null ? "距離を見積もりました。メーターと違えば直してください。" : "距離を見積もれませんでした。手で入れてください。";
        saveTrips();
        editId = t.id;   /* 終わったらすぐ確認できるように開く */
        render();
        try { $("editCard").scrollIntoView({ behavior: "smooth", block: "start" }); } catch (e) {}
      });
    });
  }

      '<b>:</b><input type="number" class="' + cls + '-m" min="0" max="59" inputmode="numeric" placeholder="--" value="' + (p[1] || "") + '"></span>';
  }
  function readTimeField(scope, cls) {
    var h = scope.querySelector("." + cls + "-h").value.trim(), m = scope.querySelector("." + cls + "-m").value.trim();
    if (h === "" && m === "") return "";
    h = Math.max(0, Math.min(23, parseInt(h, 10) || 0)); m = Math.max(0, Math.min(59, parseInt(m, 10) || 0));
    return pad(h) + ":" + pad(m);
  }

      b.addEventListener("click", function (e) { e.preventDefault(); input.value = b.getAttribute(attr); input.dispatchEvent(new Event("input")); });
    });
  }

      '<label class="field" style="margin-bottom:6px"><span>金額（円）</span><input type="number" class="c-amount" inputmode="numeric" min="0" step="1" value="' + (c.amount == null ? "" : c.amount) + '"></label></div>' +

  function renderEditor() {
    var box = $("editCard");

    box.innerHTML =
      '<div class="card-head"><h2 class="card-title">' + (t.running ? "使用中の記録" : "記録を直す") + '</h2><button class="btn" id="eClose">閉じる</button></div>' +

      '<label class="field"><span>距離（業務上走行距離 km）</span><input type="number" id="eKm" inputmode="numeric" min="0" step="1" value="' + (t.km == null ? "" : t.km) + '"></label></div>' +
      '<div class="row2"><label class="field"><span>開始</span>' + timeFieldHTML("e-start", t.start) + "</label>" +
      '<label class="field"><span>終了</span>' + timeFieldHTML("e-end", t.running ? "" : t.end) + "</label></div>" +
      '<div class="row3"><label class="field"><span>出発地</span><input type="text" id="eFrom" maxlength="20" value="' + esc(t.from) + '"></label>' +
      '<div class="field"><span>&nbsp;</span><div class="seg" id="eRound"><button data-r="1">⇔</button><button data-r="0">→</button></div></div>' +

      (t.locs && (t.locs.start || t.locs.end) ? '<p class="note" style="margin-top:0">' + (estimateKm(t) != null ? "位置からの見積もり: 約" + estimateKm(t) + "km" : "位置からは距離を見積もれませんでした") + "</p>" : "") +

    Array.prototype.forEach.call(box.querySelectorAll("#eRound button"), function (b) {

    /* 画面の入力を記録に書き戻す */
    var collect = function (strict) {

      if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) { if (strict) { showWarn("日付を入れてください。"); return false; } date = t.date; }
      var start = readTimeField(box, "e-start"), end = readTimeField(box, "e-end");
      if (strict && !start) { showWarn("開始の時刻を入れてください。"); return false; }
      if (strict && end && start && end < start) { showWarn("終了が開始より前になっています。"); return false; }
      var kmv = $("eKm").value.trim();
      var km = kmv === "" ? null : Math.max(0, Math.round(+kmv));
      if (km !== t.km) t.kmAuto = false;

      t.checked = $("eChecked").checked; t.social = $("eSocial").checked;
      t.costs = Array.prototype.map.call(box.querySelectorAll(".cost-row"), function (row, i) {

    $("eAddCost").addEventListener("click", function () {

    $("eSave").addEventListener("click", function () {

  function totals(key) {
    var list = monthTrips(key);
    var km = 0, kmSocial = 0, cost = 0, costSocial = 0;
    list.forEach(function (t) {
      if (t.km != null) { km += t.km; if (t.social) kmSocial += t.km; }
      (t.costs || []).forEach(function (c) { if (c.amount != null) { cost += c.amount; if (c.social) costSocial += c.amount; } });
    });
    var r = rate();
    return { km: km, kmSocial: kmSocial, cost: cost, costSocial: costSocial, rate: r, dist: km * r, distSocial: kmSocial * r, sub: cost + km * r, count: list.length };
  }
  function renderSum() {

      '<div class="sum-line"><span>② 業務上走行距離</span><b>' + s.km + " km</b></div>" +

      '<div class="sum-line"><span>④ 距離比例費（②×③）</span><b>' + yen(s.dist) + " 円</b></div>" +

      '<div class="sum-line sum-total"><span>①＋④（小計）</span><b>' + yen(s.sub) + " 円</b></div>";

  function renderSettings() {

  /* ---------- 設定・月の入力 ---------- */
  (function bindSettings() {
    $("sBase").addEventListener("change", function () { settings.base = $("sBase").value.trim(); saveSettings(); render(); });

      $(id).addEventListener("change", function () {
        var v = parseInt($(id).value, 10);

    S.box(f2 + 4, 4, f2 + 4, 29, "", G(9), { bottom: MD });
    /* 支払合計 */
    S.box(f2, 29, f2 + 4, 30, "支払合計", G(9, false, { align: { h: "center", v: "center", rot: 255 } }), { top: MD, bottom: MD, left: T, right: T });
    S.box(f2, 30, f2, 34, "①＋④", G(9, false, { align: { h: "left", indent: 1 } }), { top: MD });
    S.box(f2, 34, f2, 37, "（小計）", G(8.5, false, { align: C }), { top: MD });
    S.box(f2, 37, f2, NCOL, { f: sumRef + "+" + distRef, v: s.sub }, G(9, true, { align: R, fmt: '#,##0"円"' }), { top: MD, right: MD });
    /* 支払合計の記入欄（経理が書く欄なので空けておく） */
    var payLine = function (rr, label, close) {
      var lastLine = rr === f2 + 4;
      S.box(rr, 30, rr, 35, label, G(9, false, { align: { h: "left", indent: label ? 1 : 0 } }), lastLine ? { bottom: MD } : {});
      S.box(rr, 35, rr, 40, "", G(9, false, { align: R }), { bottom: T });
      S.box(rr, 40, rr, NCOL, close, G(9, false, { align: { h: "left" } }), lastLine ? { right: MD, bottom: MD } : { right: MD });
    };
    payLine(f2 + 1, "", "円");
    payLine(f2 + 2, "（うち交際費", "円）");
    payLine(f2 + 3, "（税抜", "円）");
    payLine(f2 + 4, "（消費税", "円）");
    /* 所属・氏名などの欄は会社の様式に手で書き写すので、ここでは作らない */
    return S;
  }

  function sheetXmlOf(S, book) {
    var rows = {};
    Object.keys(S.cells).forEach(function (k) { var c = S.cells[k]; (rows[c.r] = rows[c.r] || []).push(c); });
    var maxR = S.maxRow;
    var body = "";
    for (var r = 1; r <= maxR; r++) {
      var cs = (rows[r] || []).sort(function (a, b) { return a.c - b.c; });
      var h = S.rowH[r];
      body += '<row r="' + r + '"' + (h ? ' ht="' + h + '" customHeight="1"' : "") + ">" + cs.map(function (c) { return cellXml(c, book); }).join("") + "</row>";
    }
    var cols = "";
    for (var c = 0; c < NCOL; c++) cols += '<col min="' + (c + 1) + '" max="' + (c + 1) + '" width="2.63" customWidth="1"/>';
    return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">' +
      '<sheetPr><pageSetUpPr fitToPage="1"/></sheetPr>' +
      '<dimension ref="A1:' + ref(maxR, NCOL - 1) + '"/>' +
      '<sheetViews><sheetView workbookViewId="0" showGridLines="0" zoomScale="100" view="pageLayout"/></sheetViews>' +
      '<sheetFormatPr defaultRowHeight="13.5"/>' +
      "<cols>" + cols + "</cols>" +
      "<sheetData>" + body + "</sheetData>" +
      (S.merges.length ? '<mergeCells count="' + S.merges.length + '">' + S.merges.map(function (m) { return '<mergeCell ref="' + m + '"/>'; }).join("") + "</mergeCells>" : "") +
      (S.validations.length ? '<dataValidations count="' + S.validations.length + '">' + S.validations.map(function (sq) {
        return '<dataValidation type="list" allowBlank="1" showInputMessage="1" showErrorMessage="1" sqref="' + sq + '"><formula1>"交"</formula1></dataValidation>';
      }).join("") + "</dataValidations>" : "") +
      '<printOptions horizontalCentered="1"/>' +
      '<pageMargins left="0.35" right="0.3" top="0.4" bottom="0.3" header="0" footer="0"/>' +
      '<pageSetup paperSize="9" orientation="portrait" fitToWidth="1" fitToHeight="1"/>' +
      "</worksheet>";
  }

  function buildXlsx(key) {
    var S = buildForm(key);
    var book = new StyleBook();
    var sheetXml = sheetXmlOf(S, book);   /* 先に作るとスタイル表がそろう */
    var name = (+key.split("-")[1]) + "月分";
    var files = [];
    var add = function (n, t) { files.push({ name: n, data: utf8(t) }); };
    add("[Content_Types].xml",
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
      '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/>' +
      '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
      '<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>' +
      '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>');
    add("_rels/.rels",
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>');
    add("xl/workbook.xml",
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">' +
      '<sheets><sheet name="' + xmlEsc(name) + '" sheetId="1" r:id="rId1"/></sheets><calcPr calcId="191029" fullCalcOnLoad="1"/></workbook>');
    add("xl/_rels/workbook.xml.rels",
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>' +
      '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>');
    add("xl/worksheets/sheet1.xml", sheetXml);
    add("xl/styles.xml", book.xml());
    return zip(files);
  }

  function utf8(str) { return new TextEncoder().encode(str); }
  var CRC_TABLE = (function () {
    var t = new Uint32Array(256);
    for (var n = 0; n < 256; n++) { var c = n; for (var k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }
    return t;
  })();
  function crc32(buf) { var c = 0xFFFFFFFF; for (var i = 0; i < buf.length; i++) c = CRC_TABLE[(c ^ buf[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
  function zip(files) {
    var parts = [], central = [], offset = 0;
    var u16 = function (n) { return [n & 255, (n >>> 8) & 255]; };
    var u32 = function (n) { return [n & 255, (n >>> 8) & 255, (n >>> 16) & 255, (n >>> 24) & 255]; };
    files.forEach(function (f) {
      var name = utf8(f.name), crc = crc32(f.data), size = f.data.length;
      var head = [].concat(u32(0x04034b50), u16(20), u16(0x0800), u16(0), u16(0), u16(0), u32(crc), u32(size), u32(size), u16(name.length), u16(0));
      parts.push(new Uint8Array(head), name, f.data);
      central.push({ name: name, crc: crc, size: size, offset: offset });
      offset += head.length + name.length + size;
    });
    var cdStart = offset, cdSize = 0;
    central.forEach(function (c) {
      var h = [].concat(u32(0x02014b50), u16(20), u16(20), u16(0x0800), u16(0), u16(0), u16(0), u32(c.crc), u32(c.size), u32(c.size),
        u16(c.name.length), u16(0), u16(0), u16(0), u16(0), u32(0), u32(c.offset));
      parts.push(new Uint8Array(h), c.name);
      cdSize += h.length + c.name.length;
    });
    parts.push(new Uint8Array([].concat(u32(0x06054b50), u16(0), u16(0), u16(central.length), u16(central.length), u32(cdSize), u32(cdStart), u16(0))));
    return new Blob(parts, { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
  }

  function xlsxName() {
    return "運転日誌_" + monthLabel(curMonth) + ".xlsx";
  }
  function checkBeforeExport() {
    var list = monthTrips(curMonth);
    if (!list.length) { $("xlsxNote").textContent = "この月の記録がありません。"; return false; }
    var run = list.filter(function (t) { return t.running; }).length;
    var noKm = list.filter(function (t) { return !t.running && t.km == null; }).length;
    var msgs = [];
    if (run) msgs.push("使用中の記録が1件あります（Excelには入りません）");
    if (noKm) msgs.push("距離が空の記録が" + noKm + "件あります");
    if (msgs.length && !confirm(msgs.join("。") + "。このまま出力しますか？")) return false;
    return true;
  }
  $("xlsxSave").addEventListener("click", function () {
    if (!checkBeforeExport()) return;
    var blob = buildXlsx(curMonth);
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = xlsxName();
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1500);
    $("xlsxNote").textContent = "「" + xlsxName() + "」を保存しました。";
  });
  (function () {
    try {
      var f = new File(["x"], "t.xlsx", { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
      $("xlsxShare").hidden = !(navigator.share && navigator.canShare && navigator.canShare({ files: [f] }));
    } catch (e) { $("xlsxShare").hidden = true; }
  })();
  $("xlsxShare").addEventListener("click", function () {
    if (!checkBeforeExport()) return;
    var file = new File([buildXlsx(curMonth)], xlsxName(), { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
    navigator.share({ files: [file], title: xlsxName() })["catch"](function (e) {
      if (!e || e.name !== "AbortError") $("xlsxNote").textContent = "送れませんでした。「Excelファイルで保存」をお使いください。";
    });
  });

  /* ---------- 引っ越し ---------- */
  var BK_APP = "unten-nisshi-backup";
  $("bkSave").addEventListener("click", function () {
    var text = JSON.stringify({ app: BK_APP, version: 1, savedAt: Date.now(), trips: trips, settings: settings, months: months });
    var name = "運転日誌引っ越し_" + dateKey(new Date()).replace(/-/g, "") + ".txt";
    var url = URL.createObjectURL(new Blob([text], { type: "text/plain;charset=utf-8" }));
    var a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1000);
    $("bkNote").textContent = "保存しました";
  });
  $("bkLoad").addEventListener("click", function () { $("bkFile").click(); });
  $("bkFile").addEventListener("change", function (e) {
    var f = e.target.files && e.target.files[0]; e.target.value = "";
    if (!f) return;
    var fr = new FileReader();
    fr.onload = function () {
      var o = null;
      try { o = JSON.parse(String(fr.result || "")); } catch (err) { o = null; }
      if (!o || o.app !== BK_APP || !Array.isArray(o.trips)) { alert("運転日誌の引っ越しファイルではありません。"); return; }
      var have = {}; trips.forEach(function (t) { have[t.id] = 1; });
      var add = o.trips.filter(function (t) { return t && t.id && !have[t.id]; });
      if (!confirm(add.length + "件の記録を追加します。今の記録は消えません。読み込みますか？")) return;
      trips = trips.concat(add);
      Object.keys(o.settings || {}).forEach(function (k) { if (settings[k] == null || settings[k] === "") settings[k] = o.settings[k]; });
      Object.keys(o.months || {}).forEach(function (k) { if (!months[k]) months[k] = o.months[k]; });
      saveTrips(); saveSettings(); saveMonths(); render();
      alert(add.length + "件を追加しました。");
    };
    fr.readAsText(f, "utf-8");
  });

  /* ---------- 起動 ---------- */
  trips = readLS(LS_TRIPS, []) || [];
  settings = readLS(LS_SET, {}) || {};
  months = readLS(LS_MONTH, {}) || {};
  curMonth = monthOf(dateKey(new Date()));
  $("fillDate").value = dateKey(new Date());
  if (!settings.base) $("setCard").open = true;
  render();
  setInterval(function () { if (activeTrip() && document.activeElement.tagName !== "INPUT") renderNow(); }, 30000);
  window.__unten = { buildXlsx: buildXlsx, setMonth: function (k) { curMonth = k; render(); } };
})();
</script>
</body>
